[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name          tail
    Path          /var/log/auth.log,/var/log/syslog,/var/log/kern.log
    Tag           host.logs
    DB            /tmp/flb-host.db
    Mem_Buf_Limit 64MB
    Skip_Long_Lines On
    Refresh_Interval 10

[INPUT]
    Name          tail
    Path          /data/suricata/eve.json
    Parser        json
    Tag           net.suricata
    DB            /tmp/flb-suricata.db
    Mem_Buf_Limit 128MB
    Skip_Long_Lines On
    Refresh_Interval 5

[FILTER]
    Name          modify
    Match         host.logs
    Add           hostname ${HOSTNAME}
    Add           siem Insights-SIEM

[FILTER]
    Name          modify
    Match         net.suricata
    Rename        timestamp @timestamp
    Add           siem Insights-SIEM
    Add           sensor suricata

[OUTPUT]
    Name          opensearch
    Match         host.logs
    Host          opensearch
    Port          9200
    Index         insights-host-logs
    Logstash_Format On
    Suppress_Type_Name On
    Replace_Dots On
    Retry_Limit   False

[OUTPUT]
    Name          opensearch
    Match         net.suricata
    Host          opensearch
    Port          9200
    Index         insights-network-logs
    Logstash_Format On
    Suppress_Type_Name On
    Replace_Dots On
    Retry_Limit   False
